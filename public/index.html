<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawHome - Adopt, do not shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar pw-nav"><div class="container">
  <a class="navbar-brand fw-bold" href="#" onclick="pwShow('home');return false">PawHome</a>
  <div class="ms-auto d-flex gap-2 align-items-center flex-wrap" id="navRight"></div>
</div></nav>

<header class="pw-hero"><div class="container">
  <div class="d-flex flex-wrap gap-2 align-items-center">
    <button class="chip on" data-v="" onclick="pwChip('')">All pets</button>
    <button class="chip" data-v="Dog" onclick="pwChip('Dog')">Dogs</button>
    <button class="chip" data-v="Cat" onclick="pwChip('Cat')">Cats</button>
    <button class="chip" data-v="Rabbit" onclick="pwChip('Rabbit')">Rabbits</button>
    <button class="chip" data-v="Other" onclick="pwChip('Other')">Others</button>
    <input id="q" class="form-control form-control-sm ms-auto" style="max-width:200px;border-radius:999px" placeholder="Name or breed" onkeydown="if(event.key==='Enter')pwLoadPets()">
    <select id="sp" class="d-none"><option value="">All pets</option><option>Dog</option><option>Cat</option><option>Rabbit</option><option>Other</option></select>
  </div>
</div></header>

<main class="container my-4">
  <div id="alertBox"></div>
  <section id="view-browse"><div id="petList" class="row g-3"></div></section>
  <section id="view-dash" class="d-none"></section>
</main>
<footer class="app-footer">
  <div class="container">
    PawHome<span class="sep">|</span>Developed by <strong>Khuman Ritu</strong>
  </div>
</footer>

<div class="modal fade" id="authModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="authTitle">Log in</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="authAlert"></div>
    <div id="regOnly" class="d-none">
      <div class="mb-3"><label class="form-label">Full name (or shelter name)</label><input id="a_name" class="form-control"></div>
      <div class="mb-3"><label class="form-label">Phone</label><input id="a_phone" class="form-control"></div>
      <div class="mb-3"><label class="form-label">I am a</label>
        <select id="a_role" class="form-select"><option value="adopter">Adopter (looking for a pet)</option><option value="shelter">Shelter (listing pets)</option></select></div>
    </div>
    <div class="mb-3"><label class="form-label">Email</label><input id="a_email" type="email" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Password</label><input id="a_pass" type="password" class="form-control"></div>
    <button class="btn btn-pw w-100" id="authBtn" onclick="pwSubmitAuth()">Log in</button>
    <p class="text-center mt-3 mb-0"><a href="#" id="authSwitch" onclick="pwToggleAuth();return false">New here? Create an account</a></p>
  </div>
</div></div></div>

<div class="modal fade" id="reqModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="r_title">Adoption request</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div id="reqAlert"></div><input type="hidden" id="r_pet">
    <label class="form-label">Tell the shelter about your home and why you want to adopt</label>
    <textarea id="r_msg" rows="4" class="form-control mb-3"></textarea>
    <button class="btn btn-pw w-100" onclick="pwSendRequest()">Send request</button>
  </div>
</div></div></div>

<div class="modal fade" id="listModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Adoption requests</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="listBody"></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script src="site.js"></script>
</body>
</html>
